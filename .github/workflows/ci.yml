name: ML Training CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Number of trees'
        required: false
        default: '200'
      max_depth:
        description: 'Max depth of trees'
        required: false
        default: '10'

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          echo "Python version:"
          python --version
          echo "Pip version:"
          pip --version
          echo "Working directory:"
          pwd
          echo "Directory contents:"
          ls -la
          echo "MLProject contents:"
          ls -la MLProject/
          echo "Preprocessing data:"
          ls -la breast_cancer_preprocessing/

      - name: Set up dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 "scikit-learn>=1.3.0" "pandas>=2.0.0" "numpy>=1.24.0" "matplotlib>=3.7.0" "seaborn>=0.12.0"

      - name: Run mlflow project
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          mlflow run ./MLProject \
            -P n_estimators=${{ github.event.inputs.n_estimators || '200' }} \
            -P max_depth=${{ github.event.inputs.max_depth || '10' }} \
            -P min_samples_split=5 \
            -P min_samples_leaf=2 \
            -P data_dir=../breast_cancer_preprocessing \
            --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          echo "=== MLflow Runs ==="
          if [ -d "mlruns" ]; then
            echo "MLflow runs directory found"
            ls -la mlruns/
            echo ""
            echo "Experiment directories:"
            find mlruns/ -name "meta.yaml" -type f 2>/dev/null | head -20
            echo ""
            echo "Latest run info:"
            LATEST_RUN=$(find mlruns/ -maxdepth 3 -mindepth 3 -type d | sort | tail -1)
            if [ -n "$LATEST_RUN" ]; then
              echo "Latest run directory: $LATEST_RUN"
              cat "$LATEST_RUN/meta.yaml" 2>/dev/null || echo "No meta.yaml found"
            fi
          else
            echo "No local mlruns directory (using remote tracking)"
          fi
