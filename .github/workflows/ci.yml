name: ML Training CI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Number of trees'
        required: false
        default: '200'
      max_depth:
        description: 'Max depth of trees'
        required: false
        default: '10'

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          echo "Python version:"
          python --version
          echo "Pip version:"
          pip --version
          echo "Working directory:"
          pwd
          echo "Directory contents:"
          ls -la
          echo "MLProject contents:"
          ls -la MLProject/
          echo "Preprocessing data:"
          ls -la breast_cancer_preprocessing/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 "scikit-learn>=1.3.0" "pandas>=2.0.0" "numpy>=1.24.0" "matplotlib>=3.7.0" "seaborn>=0.12.0"

      - name: Run mlflow project
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          echo "=== Starting MLflow Project Training ==="
          echo "Tracking URI: ${MLFLOW_TRACKING_URI:-local}"

          # Copy preprocessing data into MLProject directory
          cp -r breast_cancer_preprocessing MLProject/breast_cancer_preprocessing

          # Run MLflow project for model retraining
          cd MLProject
          mlflow run . \
            -P n_estimators=${{ github.event.inputs.n_estimators || '200' }} \
            -P max_depth=${{ github.event.inputs.max_depth || '10' }} \
            -P min_samples_split=5 \
            -P min_samples_leaf=2 \
            -P data_dir=breast_cancer_preprocessing \
            --env-manager=local

          echo "=== MLflow Project Training Completed ==="

      - name: Get latest MLflow run_id
        run: |
          echo "=== MLflow Runs ==="
          RUN_DIR=""
          if [ -d "mlruns" ]; then
            RUN_DIR="mlruns"
          elif [ -d "MLProject/mlruns" ]; then
            RUN_DIR="MLProject/mlruns"
          fi

          if [ -n "$RUN_DIR" ]; then
            echo "MLflow runs directory found at: $RUN_DIR"
            ls -la "$RUN_DIR"
            echo ""
            LATEST_RUN=$(find "$RUN_DIR" -maxdepth 3 -mindepth 3 -type d 2>/dev/null | sort | tail -1)
            if [ -n "$LATEST_RUN" ]; then
              echo "Latest run directory: $LATEST_RUN"
              RUN_ID=$(basename "$LATEST_RUN")
              echo "Latest MLflow Run ID: $RUN_ID"
              if [ -f "$LATEST_RUN/meta.yaml" ]; then
                echo "--- meta.yaml ---"
                cat "$LATEST_RUN/meta.yaml"
              fi
            fi
          else
            echo "No local mlruns directory (using remote tracking via DagsHub)"
            echo "Check results at: ${{ secrets.MLFLOW_TRACKING_URI }}"
          fi

          # Output latest run ID using Python MLflow API
          python -c "
          import os, mlflow
          for p in [os.environ.get('MLFLOW_TRACKING_URI'), 'MLProject/mlruns', 'mlruns']:
              if p and (os.path.isdir(p) or p.startswith('http')):
                  try:
                      mlflow.set_tracking_uri(p if p.startswith('http') else 'file://' + os.path.abspath(p))
                      runs = mlflow.search_runs(search_all_experiments=True, order_by=['start_time DESC'], max_results=1)
                      if not runs.empty:
                          print('=== MLflow Latest Run ID via API ===')
                          print(runs.iloc[0]['run_id'])
                          break
                  except Exception:
                      pass
          " || true
