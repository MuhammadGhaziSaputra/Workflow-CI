name: ML Training CI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Number of trees'
        required: false
        default: '200'
      max_depth:
        description: 'Max depth of trees'
        required: false
        default: '10'

jobs:
  train-model:
    runs-on: ubuntu-24.04

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          echo "Python version:"
          python --version
          echo "Pip version:"
          pip --version
          echo "Working directory:"
          pwd
          echo "Directory contents:"
          ls -la
          echo "MLProject contents:"
          ls -la MLProject/
          echo "Preprocessing data:"
          ls -la breast_cancer_preprocessing/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 "scikit-learn>=1.3.0" "pandas>=2.0.0" "numpy>=1.24.0" "matplotlib>=3.7.0" "seaborn>=0.12.0"

      - name: Run mlflow project
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          set -e
          set -o pipefail
          echo "=== Starting MLflow Project Training ==="

          # Clean and sanitize tracking URI
          TRACKING_URI=$(echo "${MLFLOW_TRACKING_URI:-}" | tr -d ' ' | tr -d '"' | tr -d "'" | tr -d '\r' | tr -d '\n' | sed 's:/*$::')

          export TRACKING_URI
          python3 -c "
          import os, urllib.parse
          u = os.environ.get('TRACKING_URI', '')
          p = urllib.parse.urlparse(u)
          print(f'::notice title=URI Diagnostics::Scheme={p.scheme}, Host={p.hostname}, Port={p.port}, Path={p.path}, Length={len(u)}')
          "


          # Auto-correct DagsHub URI if missing .mlflow suffix
          if echo "$TRACKING_URI" | grep -qi 'dagshub\.com' && ! echo "$TRACKING_URI" | grep -qi '\.mlflow$'; then
            echo "::notice::Auto-correcting DagsHub URI by appending .mlflow: ${TRACKING_URI}.mlflow"
            TRACKING_URI="${TRACKING_URI}.mlflow"
          fi

          if [ -z "$TRACKING_URI" ]; then
            echo "::notice::No remote MLFLOW_TRACKING_URI provided. Using local filesystem tracking."
            unset MLFLOW_TRACKING_URI
            unset MLFLOW_TRACKING_USERNAME
            unset MLFLOW_TRACKING_PASSWORD
          elif echo "$TRACKING_URI" | grep -qiE '^(https?://)?(localhost|127\.0\.0\.1)'; then
            echo "::warning::MLFLOW_TRACKING_URI is set to localhost ($TRACKING_URI). Starting local MLflow server on runner port 5000..."
            mlflow server --host 127.0.0.1 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns &
            sleep 4
            export MLFLOW_TRACKING_URI="http://127.0.0.1:5000"
            echo "::notice::Local MLflow server is active at http://127.0.0.1:5000"
          else
            echo "::notice::Using Remote MLflow Tracking URI: $TRACKING_URI"
            export MLFLOW_TRACKING_URI="$TRACKING_URI"
          fi

          # Copy preprocessing data into MLProject directory
          cp -r breast_cancer_preprocessing MLProject/breast_cancer_preprocessing

          # Run MLflow project for model retraining
          cd MLProject
          set +e
          mlflow run . \
            -P n_estimators=200 \
            -P max_depth=10 \
            -P min_samples_split=5 \
            -P min_samples_leaf=2 \
            -P data_dir=breast_cancer_preprocessing \
            --env-manager=local > /tmp/mlflow.log 2>&1
          RUN_EXIT=$?
          cat /tmp/mlflow.log

          if [ $RUN_EXIT -ne 0 ]; then
            ERR_MSG=$(tail -n 15 /tmp/mlflow.log | tr '\n' ' ')
            echo "::error title=MLflow Run Failed::$ERR_MSG"
            exit $RUN_EXIT
          fi

          echo "=== MLflow Project Training Completed Successfully ==="

      - name: Get latest MLflow run_id
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          set -e
          echo "=== MLflow Runs Info ==="
          TRACKING_URI=$(echo "${MLFLOW_TRACKING_URI:-}" | tr -d ' ' | tr -d '"' | tr -d "'" | tr -d '\r' | tr -d '\n' | sed 's:/*$::')

          if echo "$TRACKING_URI" | grep -qi 'dagshub\.com' && ! echo "$TRACKING_URI" | grep -qi '\.mlflow$'; then
            TRACKING_URI="${TRACKING_URI}.mlflow"
          fi

          if echo "$TRACKING_URI" | grep -qiE '^(https?://)?(localhost|127\.0\.0\.1)'; then
            export MLFLOW_TRACKING_URI="http://127.0.0.1:5000"
          elif [ -n "$TRACKING_URI" ]; then
            export MLFLOW_TRACKING_URI="$TRACKING_URI"
          fi

          python -c "
          import os, mlflow
          uri = os.environ.get('MLFLOW_TRACKING_URI')
          candidates = [uri, 'http://127.0.0.1:5000', 'MLProject/mlruns', 'mlruns'] if uri else ['http://127.0.0.1:5000', 'MLProject/mlruns', 'mlruns']
          found = False
          for p in candidates:
              if not p:
                  continue
              try:
                  mlflow.set_tracking_uri(p if p.startswith('http') else 'file://' + os.path.abspath(p))
                  runs = mlflow.search_runs(search_all_experiments=True, order_by=['start_time DESC'], max_results=1)
                  if not runs.empty:
                      latest = runs.iloc[0]
                      print('=== MLflow Latest Run ID via API ===')
                      print(f'Run ID: {latest[\"run_id\"]}')
                      print(f'Status: {latest.get(\"status\", \"FINISHED\")}')
                      print('Metrics:')
                      for col in runs.columns:
                          if col.startswith('metrics.'):
                              print(f'  {col.replace(\"metrics.\", \"\")}: {latest[col]:.4f}')
                      found = True
                      break
              except Exception:
                  pass
          if not found:
              print('Check results directory on filesystem:')
              for d in ['mlruns', 'MLProject/mlruns']:
                  if os.path.exists(d):
                      print(f'Directory {d} exists.')
          "
